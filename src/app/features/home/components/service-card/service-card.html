<article class="card" [attr.aria-labelledby]="'service-title-' + service().id">
  <div class="card__image">
    <img [src]="service().imageUrl" [alt]="service().imageAlt" width="640" height="800" loading="lazy" decoding="async">
  </div>
  <div class="card__content">
    <h3 [id]="'service-title-' + service().id">{{ service().title }}</h3>
    <p>{{ service().description }}</p>
    @if (whatsappUrl(); as url) {
      <a class="consult" [href]="url" target="_blank" rel="noopener noreferrer"
        [attr.aria-label]="'Consultar por WhatsApp sobre ' + service().title + ' (nueva pestaña)'">
        Consultar por WhatsApp<span aria-hidden="true">↗</span>
      </a>
    } @else {
      <button class="consult" type="button" disabled [attr.aria-describedby]="'service-note-' + service().id">
        Consultar por WhatsApp<span aria-hidden="true">↗</span>
      </button>
      <small [id]="'service-note-' + service().id">WhatsApp pendiente · Demo</small>
    }
  </div>
</article>
