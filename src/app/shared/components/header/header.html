<header class="header">
  <div class="header__inner">
    <a class="brand" href="#inicio" aria-label="Bella Studio, inicio" (click)="closeMenu()">
      Bella<span>Studio</span>
      <small>MAKEUP ARTIST</small>
    </a>
    <button #menuToggle class="menu-toggle" type="button"
      aria-controls="primary-navigation" [attr.aria-expanded]="menuOpen()"
      [attr.aria-label]="menuOpen() ? 'Cerrar menú de navegación' : 'Abrir menú de navegación'"
      (click)="menuOpen.set(!menuOpen())">
      <span aria-hidden="true">{{ menuOpen() ? '✕' : '☰' }}</span>
    </button>
    <nav id="primary-navigation" class="navigation" [class.is-open]="menuOpen()" aria-label="Navegación principal">
      <ul>
        @for (link of links; track link.href) {
          <li><a [href]="link.href" (click)="closeMenu()">{{ link.label }}</a></li>
        }
      </ul>
      @if (booking.whatsappUrl; as url) {
        <a class="booking" [href]="url" target="_blank" rel="noopener noreferrer" (click)="closeMenu()">Reservar cita<span class="sr-only"> por WhatsApp (nueva pestaña)</span></a>
      } @else {
        <div class="booking-placeholder">
          <button class="booking" type="button" disabled aria-describedby="header-booking-note">Reservar cita</button>
          <small id="header-booking-note">WhatsApp pendiente · Demo</small>
        </div>
      }
    </nav>
  </div>
</header>
